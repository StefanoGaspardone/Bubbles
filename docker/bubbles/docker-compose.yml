services:

  # ============================================
  # DATABASE
  # ============================================
  database:
    image: postgres:17
    container_name: bubbles_db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-bubbles_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-bubbles_pass}"
      POSTGRES_DB: "${POSTGRES_DB:-bubbles_db}"
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: "no"

  # ============================================
  # PGADMIN
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:9.13
    container_name: bubbles_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@bubbles.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-admin_bubbles}"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - database
    restart: "no"

  # ============================================
  # MINIO
  # ============================================
  minio:
    image: quay.io/minio/minio:latest
    container_name: bubbles_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ============================================
  # EMAIL
  # ============================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: bubbles_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    restart: "no"

volumes:
  db_data:
  pgadmin_data:
  minio_data:
  mailpit_data: