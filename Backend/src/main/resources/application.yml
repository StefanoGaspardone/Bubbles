spring:
# ============================================================
# APPLICATION CONFIGURATION
# ============================================================
  application:
    name: LetsTable Backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# ============================================================
# MAIL CONFIGURATION
# ============================================================
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
    from-address: ${MAIL_FROM_ADDRESS:no-reply@fetchly.com}
    from-name: Bubbles

# ============================================================
# DATABASE CONFIGURATION
# ============================================================
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
    open-in-view: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bubbles_db}
    username: ${DATABASE_USERNAME:bubbles_user}
    password: ${DATABASE_PASSWORD:bubbles_pass}
  flyway:
    baseline-on-migrate: true

# ============================================================
# SWAGGER CONFIGURATION
# ============================================================
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs

# ============================================================
# SERVER CONFIGURATION
# ============================================================
server:
  port: ${PORT:8080}
  address: 0.0.0.0

# ============================================================
# JWT CONFIGURATION
# ============================================================
jwt:
  secret: ${JWT_SECRET:59e01dfd95914a2922b3e94636b2d4c4f1633f19f2d55a7cde95ec60cf476e0b}
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 30

# ============================================================
# OTP CONFIGURATION
# ============================================================
otp:
  ttl-minutes: 30
  max-attempts: 3
  resend-cooldown-seconds: 60

# ============================================================
# S3 CONFIGURATION
# ============================================================
s3:
  url: ${S3_URL:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadmin}
  bucket: ${S3_BUCKET:uploads}
  region: ${S3_REGION:eu-central-1}

# ============================================================
# CORS CONFIGURATION
# ============================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
