<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:with="emailTitle='Attivazione Account'"
      th:replace="~{emails/layout :: body(content=~{::#main-content})}">
<head>
    <meta charset="UTF-8" />
</head>
<body>
<div id="main-content">
    <h2 style="color: #1f1b18; font-size: 22px; font-weight: 700; margin: 8px 0 12px 0; text-align: center;">
        Verifica la tua email
    </h2>
    <p style="color: #57504a; font-size: 15px; line-height: 1.6; margin: 0 0 24px 0; text-align: center;">
        Usa il codice monouso sottostante per completare la registrazione ed attivare il tuo account.
    </p>

    <div style="text-align: center; margin: 24px 0; background-color: #faf6f0; border: 1px solid #eedec8; border-radius: 12px; padding: 20px 16px;">
            <span style="display: inline-block; font-family: 'Courier New', Courier, monospace; font-size: 34px; letter-spacing: 10px; font-weight: 800; color: #b84929;"
                  th:text="${otpCode}">123456</span>
    </div>

    <p style="color: #8c827a; font-size: 13px; line-height: 1.5; text-align: center; margin: 0;">
        ⏱️ Questo codice scadrà tra <strong style="color: #57504a;" th:text="${expiresInMinutes}">10</strong> minuti.
    </p>
</div>
</body>
</html>
