<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layout :: body(title='Reimposta la password', preheader=|Il tuo codice per reimpostare la password è ${otpCode}|, content=~{::#main-content})}">
<head>
    <meta charset="UTF-8" />
</head>
<body>
<div id="main-content">
    <h1 style="margin: 0 0 12px 0; color: #0b1c2a; font-size: 22px; font-weight: 700; line-height: 1.3; text-align: center;">
        Reimposta la tua password
    </h1>
    <p style="margin: 0 0 24px 0; color: #516676; font-size: 15px; line-height: 1.6; text-align: center;">
        Abbiamo ricevuto una richiesta per reimpostare la password del tuo account. Inserisci questo codice nell'app per sceglierne una nuova.
    </p>

    <th:block th:replace="~{emails/components :: otp(code=${otpCode}, minutes=${expiresInMinutes})}" />

    <p style="margin: 20px 0 0 0; padding: 12px 16px; background-color: #f6fbfd; border: 1px solid #d2e1e7; border-radius: 10px; color: #516676; font-size: 13px; line-height: 1.6; text-align: center;">
        Non hai chiesto tu il reset? La tua password resta invariata finché qualcuno non usa questo codice: puoi ignorare questa email.
    </p>
</div>
</body>
</html>
